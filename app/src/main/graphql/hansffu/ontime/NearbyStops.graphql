query NearbyStops($latitude: Float!, $longitude: Float!, $cursor: String) {
    nearest(
        after: $cursor,
        latitude: $latitude,
        longitude: $longitude,
        filterByPlaceTypes: [stopPlace]
    ) {
        edges {
            node {
                distance
                place {
                    ... on StopPlace {
                        id
                        name
                        latitude
                        longitude
                        transportMode
                    }
                }
            }
        }
    }
}
